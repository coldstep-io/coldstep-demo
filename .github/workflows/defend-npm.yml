name: "Demo: defend mode — npm allowlisted"
on:
  workflow_dispatch:

# This workflow goes GREEN when defend mode correctly blocks an unauthorized
# connection. It demonstrates both halves of defend mode in one run:
#   1. A legitimate `npm install express` over the allowlisted registry SUCCEEDS
#      — defend does not get in the way of traffic you approved.
#   2. An explicitly unauthorized egress (to a host NOT on the allowlist) is
#      DROPPED at the cgroup connect4 hook — and the job asserts that it was.
# A red ❌ here means defend FAILED to block the unauthorized egress (a real
# regression), not that "the block worked".

jobs:
  defend-demo:
    runs-on: ubuntu-latest
    steps:
      - id: coldstep
        uses: coldstep-io/coldstep@v0.6.1
        with:
          mode: defend
          fail-on-error: true
          allow: |
            registry.npmjs.org
            cdn.npmjs.com
          # No loopback entry needed: coldstep always bypasses IPv4 loopback
          # (127.0.0.0/8) in defend mode, so npm's getaddrinfo() reaches the
          # systemd-resolved stub at 127.0.0.53:53 and DNS keeps working. (The
          # old `ignored-nets` input was removed upstream; loopback is implicit
          # now — add `!CIDR` entries to `allow` for any other ignores.)

      # (1) Legitimate, allowlisted traffic — expected to SUCCEED.
      - name: Install express (allowlisted registry — should succeed)
        id: npm-install
        continue-on-error: true
        run: npm install express

      # (2) Unauthorized egress — defend is EXPECTED to drop this. 1.1.1.1 is a
      # literal IP (no DNS needed) and is not on the allowlist, so the connect4
      # hook drops the packet and curl fails. This is the deterministic block.
      - name: Attempt unauthorized egress (defend must block this)
        id: rogue-egress
        continue-on-error: true
        run: |
          echo "Attempting connection to 1.1.1.1:443, which is NOT on the allowlist..."
          curl -sS --max-time 15 https://1.1.1.1/ -o /dev/null

      # (3) Green-on-block gate: the job passes iff defend dropped the
      # unauthorized egress. It fails only if the rogue connection got through.
      - name: Assert defend blocked the unauthorized egress
        env:
          ROGUE_OUTCOME: ${{ steps.rogue-egress.outcome }}
          INSTALL_OUTCOME: ${{ steps.npm-install.outcome }}
        run: |
          echo "npm install (allowlisted) outcome: ${INSTALL_OUTCOME}"
          echo "unauthorized egress outcome:       ${ROGUE_OUTCOME}"
          if [ "${ROGUE_OUTCOME}" = "failure" ]; then
            echo "✅ PASS — defend mode dropped the connection to 1.1.1.1 (not on the allowlist)."
            exit 0
          else
            echo "❌ FAIL — the unauthorized egress to 1.1.1.1 was NOT blocked. Defend mode did not enforce the allowlist."
            exit 1
          fi

      - name: Defend mode showcase (summary)
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.npm-install.outcome }}
          ROGUE_OUTCOME: ${{ steps.rogue-egress.outcome }}
        run: |
          {
            echo '## Defend mode showcase'
            echo ''
            echo 'Allowlist: `registry.npmjs.org`, `cdn.npmjs.com`. Loopback (`127.0.0.0/8`) ignored for the local DNS stub.'
            echo ''
            echo '| step | what it tests | outcome | meaning |'
            echo '| :--- | :------------ | :------ | :------ |'
            if [ "${INSTALL_OUTCOME}" = "success" ]; then
              echo "| \`npm install express\` | allowlisted traffic passes | \`success\` | ✅ defend does not break approved installs |"
            else
              echo "| \`npm install express\` | allowlisted traffic passes | \`${INSTALL_OUTCOME}\` | ⚠️ see step logs |"
            fi
            if [ "${ROGUE_OUTCOME}" = "failure" ]; then
              echo "| \`curl 1.1.1.1\` | unauthorized egress | \`failure\` | ✅ **dropped at connect4 — this is the showcase** |"
            else
              echo "| \`curl 1.1.1.1\` | unauthorized egress | \`${ROGUE_OUTCOME}\` | ❌ NOT blocked — defend regression |"
            fi
            echo ''
            echo 'A green check on this job means defend mode **enforced the allowlist**: the registry traffic express needed went through, and the unauthorized connection to `1.1.1.1` was dropped before it left the runner.'
            echo ''
            echo 'The `deny` events (with the dropped destinations) are in `.coldstep-events.jsonl`, uploaded as an artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      # In defend mode the agent writes its telemetry as root with restrictive
      # perms, so the upload step (running as the runner user) can't read it.
      # Relax the perms so the artifact uploads.
      - name: Make coldstep telemetry readable
        if: always()
        run: sudo chmod -R a+r .coldstep-* 2>/dev/null || true

      - name: Upload coldstep telemetry
        if: always()
        # Telemetry is a nice-to-have; never let an artifact hiccup turn a
        # correct defend run red. The green/red signal is the assert step above.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coldstep-${{ github.job }}-${{ github.run_id }}
          # Glob every coldstep output regardless of mode-specific filenames.
          path: |
            .coldstep-*.jsonl
            .coldstep-*.md
            .coldstep-*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
