<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 472" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <rect width="780" height="472" rx="10" fill="#0d1117"/>
  <!-- titlebar -->
  <rect width="780" height="34" rx="10" fill="#161b22"/>
  <rect y="20" width="780" height="14" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="390" y="22" text-anchor="middle" fill="#7d8590" font-size="12">coldstep — npm install: see it, then block it</text>

  <!-- DETECT -->
  <text x="22" y="64" fill="#58a6ff" font-weight="bold">detect</text>
  <text x="86" y="64" fill="#7d8590">$ npm install express   # eBPF agent attached, observe-only</text>

  <text x="22" y="92" fill="#c9d1d9" font-weight="bold">IPv4 egress</text>
  <text x="150" y="92" fill="#6e7681">— every destination the install actually touched</text>

  <text x="34" y="118" fill="#e3b341">registry.npmjs.org</text>
  <text x="300" y="118" fill="#8b949e">104.16.4.34:443</text>
  <text x="690" y="118" fill="#3fb950" text-anchor="end">30×</text>

  <text x="34" y="142" fill="#e3b341">168.63.129.16</text>
  <text x="300" y="142" fill="#8b949e">:53, :80  (Azure cloud metadata)</text>
  <text x="690" y="142" fill="#3fb950" text-anchor="end">14×</text>

  <text x="34" y="166" fill="#e3b341">results-receiver.actions.githubusercontent.com</text>
  <text x="690" y="166" fill="#3fb950" text-anchor="end">1×</text>

  <text x="34" y="190" fill="#e3b341">hosted-compute-…githubapp.com</text>
  <text x="690" y="190" fill="#3fb950" text-anchor="end">1×</text>

  <text x="22" y="218" fill="#6e7681" font-size="12.5">a one-line install reaches the registry — plus GitHub &amp; Azure infrastructure.</text>

  <line x1="22" y1="240" x2="758" y2="240" stroke="#21262d" stroke-width="1"/>

  <!-- DEFEND -->
  <text x="22" y="276" fill="#bc8cff" font-weight="bold">defend</text>
  <text x="92" y="276" fill="#7d8590">allow: registry.npmjs.org — drop everything else at the kernel</text>

  <!-- legit -->
  <rect x="22" y="296" width="736" height="40" rx="6" fill="#0f2417" stroke="#1f6f3f"/>
  <text x="38" y="321" fill="#3fb950" font-weight="bold">✔</text>
  <text x="60" y="321" fill="#c9d1d9">npm install express</text>
  <text x="300" y="321" fill="#8b949e">allowlisted registry traffic</text>
  <text x="742" y="321" fill="#3fb950" text-anchor="end" font-weight="bold">SUCCESS</text>

  <!-- blocked -->
  <rect x="22" y="346" width="736" height="40" rx="6" fill="#2a1416" stroke="#8a2a2a"/>
  <text x="38" y="371" fill="#f85149" font-weight="bold">✗</text>
  <text x="60" y="371" fill="#c9d1d9">curl 1.1.1.1</text>
  <text x="300" y="371" fill="#8b949e">unauthorized egress (not on allowlist)</text>
  <text x="742" y="371" fill="#f85149" text-anchor="end" font-weight="bold">BLOCKED</text>

  <text x="22" y="414" fill="#6e7681" font-size="12.5">dropped at the cgroup connect4 hook — the packet never left the runner.</text>
  <text x="22" y="440" fill="#8b949e" font-size="12.5">green check = defend enforced the allowlist.  Full digests committed in</text>
  <text x="560" y="440" fill="#58a6ff" font-size="12.5">demo-output/</text>
</svg>
